name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: ReelScore.sln
  API_PROJECT_PATH: src/ReelScore.Api/ReelScore.Api.csproj

jobs:
  validate:
    name: Restore, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Verify formatting
        run: >
          dotnet format "$SOLUTION_PATH"
          --no-restore
          --verify-no-changes
          --verbosity minimal

      - name: Build Debug configuration
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration Debug
          --no-restore

      - name: Build Release configuration
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration Release
          --no-restore

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Reject vulnerable NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail

          report="$(dotnet list "$API_PROJECT_PATH" package \
            --vulnerable \
            --include-transitive)"

          echo "$report"

          if echo "$report" | grep -q \
            "has the following vulnerable packages"; then
            echo "::error::Known vulnerable NuGet packages were detected."
            exit 1
          fi

          echo "No known vulnerable NuGet packages detected."

      - name: Report deprecated NuGet dependencies
        run: >
          dotnet list "$API_PROJECT_PATH"
          package
          --deprecated
          --include-transitive

  publish:
    name: Publish API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate
      - security

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore API dependencies
        run: dotnet restore "$API_PROJECT_PATH"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Publish API
        run: >
          dotnet publish "$API_PROJECT_PATH"
          --configuration Release
          --no-restore
          --output artifacts/reelscore-api

      - name: Verify published output
        shell: bash
        run: |
          set -euo pipefail

          test -f artifacts/reelscore-api/ReelScore.Api.dll
          test -f artifacts/reelscore-api/ReelScore.Api.deps.json
          test -f artifacts/reelscore-api/ReelScore.Api.runtimeconfig.json

          echo "ReelScore API publish output verified."

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: reelscore-api-${{ github.sha }}
          path: artifacts/reelscore-api/
          if-no-files-found: error
          retention-days: 14