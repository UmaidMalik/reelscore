name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".editorconfig"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: ReelScore.sln
  API_PROJECT_PATH: src/ReelScore.Api/ReelScore.Api.csproj

jobs:
  validate:
    name: Restore, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Verify code formatting
        run: >
          dotnet format "$SOLUTION_PATH"
          --no-restore
          --verify-no-changes
          --verbosity diagnostic

      - name: Build Debug configuration
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration Debug
          --no-restore

      - name: Build Release configuration
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration Release
          --no-restore

  test:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build test dependencies
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test "$SOLUTION_PATH"
          --configuration Release
          --no-build
          --logger "trx;LogFileName=reelscore-tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "$API_PROJECT_PATH"

      - name: Publish API
        run: >
          dotnet publish "$API_PROJECT_PATH"
          --configuration Release
          --no-restore
          --output artifacts/reelscore-api

      - name: Verify published assembly
        shell: bash
        run: |
          test -f artifacts/reelscore-api/ReelScore.Api.dll
          test -f artifacts/reelscore-api/ReelScore.Api.deps.json
          test -f artifacts/reelscore-api/ReelScore.Api.runtimeconfig.json

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: reelscore-api
          path: artifacts/reelscore-api/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: List vulnerable dependencies
        run: >
          dotnet list "$SOLUTION_PATH"
          package
          --vulnerable
          --include-transitive